services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movie-night-web
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "4000:4000"
    volumes:
      - ${DATA_DIR:-./data}:/app/data
    environment:
      - DATABASE_URL=file:/app/data/dev.db
      - OMDB_API_KEY=${OMDB_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - CRON_SECRET=${CRON_SECRET}
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-Brian}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - STEW_PASSWORD=${STEW_PASSWORD:-stew}
      - NICK_PASSWORD=${NICK_PASSWORD:-nick}
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: movie-night-tunnel
    command: tunnel --no-autoupdate run --url http://web:4000
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - web
    restart: unless-stopped

  cron:
    image: alpine:latest
    container_name: movie-night-cron
    restart: unless-stopped
    depends_on:
      - web
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - CRON_SECRET=${CRON_SECRET}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 12 * * *}
    entrypoint: |
      sh -c '
      echo "Installing curl..."
      apk add --no-cache curl
      echo "Configuring crontab to run at: $$CRON_SCHEDULE..."
      echo "$$CRON_SCHEDULE curl -s \"http://web:4000/api/cron/remind-votes?secret=$$CRON_SECRET\"" > /etc/crontabs/root
      echo "Starting cron daemon..."
      exec crond -f -l 2
      '
